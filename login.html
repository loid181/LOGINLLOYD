<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Lloyd's Login</title>
</head>
<body>
    <div class="layer" id="one"> 
        <h1 class="brand-title">Lloyd's</h1>
        <div id="loginparts">
            <span class="login-heading">login</span> 
            <input type="text" class="inputs" placeholder="Username"> 
            <input type="password" class="inputs" placeholder="Password">
            
            <button class="social-btn">
                <img src="images/google logo.png" class="social-logo" alt="Google"> Continue with Google
            </button>
            <button class="social-btn">
                <img src="images/fb.png" class="social-logo" alt="Facebook"> Continue with Facebook
            </button>
            <button class="social-btn">
                <img src="images/apple.png" class="social-logo" alt="Apple"> Continue with Apple
            </button>

            <button id="btnlogin">login</button>
        </div>
    </div>
</body>
</html>
